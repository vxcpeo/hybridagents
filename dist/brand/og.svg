<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Quittra - the settlement layer for autonomous agents">
  <title>Quittra - the settlement layer for autonomous agents</title>
  <rect width="1200" height="630" fill="#f6f2e8"/>
  <rect x="24" y="24" width="1152" height="582" fill="none" stroke="#a79e89"/>
  <rect x="32" y="32" width="1136" height="566" fill="none" stroke="#cfc6b3"/>
  <g transform="translate(84 74) scale(0.8750)">
    <rect width="64" height="64" rx="14" fill="#0c5681"/>
  <circle cx="31" cy="31" r="21" fill="none" stroke="#f6f2e8" stroke-width="4.8"/>
  <path d="M38 38 L51.7 51.7" fill="none" stroke="#f6f2e8" stroke-width="5.6" stroke-linecap="round"/>
  <path d="M22.8 32.2 L29 38.4 L41.2 25.6" fill="none" stroke="#f6f2e8" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="156" y="104" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" letter-spacing="9" fill="#15161a" text-anchor="start">QUITTRA</text>
  <text x="158" y="130" font-family="'Courier New', monospace" font-size="12.5" font-weight="400" letter-spacing="3" fill="#5d5c55" text-anchor="start">QUITTRA.XYZ / SOLANA</text>
  <text x="1116" y="104" font-family="'Courier New', monospace" font-size="12.5" font-weight="400" letter-spacing="2.4" fill="#5d5c55" text-anchor="end">SETTLEMENT FOLIO</text>
  <line x1="84" y1="176" x2="1116" y2="176" stroke="#15161a" stroke-width="1.6"/>
  <text x="84" y="306" font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="700" letter-spacing="-1.4" fill="#15161a" text-anchor="start">The settlement layer</text>
  <text x="84" y="380" font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="400" letter-spacing="-1.4" fill="#083f60" text-anchor="start">for autonomous agents.</text>
  <text x="84" y="442" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="400" letter-spacing="0" fill="#3d3f46" text-anchor="start">Every agent gets a Solana PDA identity. Every run writes a receipt: input hash, output hash, success flag.</text>
  <line x1="84" y1="520" x2="1116" y2="520" stroke="#a79e89" stroke-width="1"/>
  <text x="84" y="558" font-family="'Courier New', monospace" font-size="12.5" font-weight="400" letter-spacing="2.6" fill="#5d5c55" text-anchor="start">EVERY TASK LEAVES A RECEIPT</text>
  <text x="1116" y="558" font-family="'Courier New', monospace" font-size="13" font-weight="400" letter-spacing="2.6" fill="#083f60" text-anchor="end">@QUITTRA_XYZ</text>
</svg>
