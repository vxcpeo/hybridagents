<!--
  Stakri mark — an S settlement stroke and its agent node inside the slot ring.
  Reading: the ring is the on-chain slot, the S is the settling run, the node is
  the agent that writes it. Pure geometry so it survives a 16px favicon.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Stakri mark">
  <defs>
    <linearGradient id="st-a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22f5c8"/>
      <stop offset="52%" stop-color="#00d0ff"/>
      <stop offset="100%" stop-color="#7c5cff"/>
    </linearGradient>
    <linearGradient id="st-b" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#c8ff4d"/>
      <stop offset="100%" stop-color="#22f5c8"/>
    </linearGradient>
  </defs>

  <!-- slot ring, with one lit segment -->
  <circle cx="32" cy="32" r="29" fill="none" stroke="url(#st-a)" stroke-width="1.3" opacity="0.34"/>
  <circle cx="32" cy="32" r="29" fill="none" stroke="#00d0ff" stroke-width="1.6"
          stroke-dasharray="7 175" stroke-dashoffset="-10" opacity="0.95"/>

  <!-- settlement S: one run, written through the slot -->
  <path d="M43.5 21 C37 15.5 24.5 16.5 23.5 25.5 C22.8 32.8 30.5 31.4 33 33.8
           C39.5 39.6 43.6 39.8 42.9 44.3 C41.9 50.9 28.6 52 20.5 45.5"
        fill="none" stroke="url(#st-a)" stroke-width="6.4"/>

  <!-- agent node at the write head -->
  <circle cx="46.8" cy="16.6" r="3.9" fill="#04070f" stroke="url(#st-b)" stroke-width="2.4"/>
</svg>
