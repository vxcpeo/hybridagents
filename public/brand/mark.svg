  <path d="M38.5 38.5 L53 53" fill="none" stroke="#a97bff" stroke-width="6" stroke-linecap="round"/>
  <path d="M22.5 32.5 L29 39 L41.5 25" fill="none" stroke="#a97bff" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>
